name: Minecraft AFK Bot

on: 
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # Cứ mỗi 30 phút hệ thống sẽ tự kiểm tra và bật lại bot nếu bị tắt

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install mineflayer

    - name: Start Bot
      run: node bot.js
